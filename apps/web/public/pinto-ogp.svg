  <title id="ogp-title">Pinto | 壁の写真から、次の一本を。</title>
  <desc id="ogp-description">壁の写真にホールドを置いて、自分だけの課題を記録・共有するクライミングアプリ。</desc>
  <rect width="1200" height="630" fill="#F6F5F0" />

  <g>
    <rect x="82" y="72" width="42" height="42" rx="10" fill="#202522" />

    <rect x="82" y="156" width="200" height="34" rx="17" fill="#E4EEE8" />
    <circle cx="101" cy="173" r="5" fill="#2F7A68" />
    <text x="116" y="179" fill="#2F7A68" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">壁とルートの記録アプリ</text>

    <text x="82" y="275" fill="#202522" stroke="#202522" stroke-width="1.5" paint-order="stroke" font-family="Noto Sans CJK JP, sans-serif" font-size="58" font-weight="700" letter-spacing="0">壁の写真から、</text>
    <text x="82" y="355" fill="#202522" stroke="#202522" stroke-width="1.5" paint-order="stroke" font-family="Noto Sans CJK JP, sans-serif" font-size="58" font-weight="700">次の</text>
    <text x="198" y="355" fill="#2F7A68" stroke="#2F7A68" stroke-width="1.5" paint-order="stroke" font-family="Noto Sans CJK JP, sans-serif" font-size="58" font-weight="700">一本</text>
    <text x="314" y="355" fill="#202522" stroke="#202522" stroke-width="1.5" paint-order="stroke" font-family="Noto Sans CJK JP, sans-serif" font-size="58" font-weight="700">を。</text>
    <text x="84" y="421" fill="#555F58" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400">ホールドを置いて、自分だけの課題をつくろう。</text>
    <text x="84" y="459" fill="#788079" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400">記録して、仲間とシェア。</text>

    <path d="M84 532H436" stroke="#D8DCD5" stroke-width="2" stroke-linecap="round" />
    <circle cx="88" cy="566" r="7" fill="#E96D4D" />
    <circle cx="112" cy="566" r="7" fill="#F2D13D" />
    <circle cx="136" cy="566" r="7" fill="#2F7A68" />
    <text x="158" y="572" fill="#788079" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="500">クライミングの楽しさを、もっと自由に。</text>
  </g>


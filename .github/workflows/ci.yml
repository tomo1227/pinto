name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SIMULATOR_NAME: iPhone 18 Pro Max
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start iOS Simulator
        run: |
          simulator=$(xcrun simctl list -j | jq -ce --arg name "$SIMULATOR_NAME" '
            . as $simctl
            | [.runtimes[]
               | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))]
            | sort_by(.version | split(".") | map(tonumber))
            | reverse
            | [.[].identifier as $runtime
               | $simctl.devices[$runtime][]?
               | select(.isAvailable and .name == $name)]
            | first // error("No available iOS Simulator named \($name)")
          ')
          id=$(jq -er '.udid' <<< "$simulator")
          state=$(jq -er '.state' <<< "$simulator")
          if [[ "$state" != "Booted" && "$state" != "Booting" ]]; then
            xcrun simctl boot "$id"
          fi
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
          echo "TEST_DESTINATION=platform=iOS Simulator,id=$id" >> "$GITHUB_ENV"

      - name: Lint
        run: make lint

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Check complexity
        run: make complex

      - name: Build
        run: make build

      - name: Build iOS tests
        run: make build-ios-tests

      - name: Wait for iOS Simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Test
        run: make test-ios-without-building

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Check complexity
        run: make complex

      - name: Build
        run: make build

      - name: Test
        run: make test
